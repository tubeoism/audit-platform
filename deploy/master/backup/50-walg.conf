# Installed as /etc/postgresql/16/main/conf.d/50-walg.conf by backup-setup.sh.
# Continuous WAL archiving to Cloudflare R2 (audit-live) with WAL-G. Changing archive_mode needs a restart.
archive_mode = on
archive_command = '/usr/local/bin/audit-walg wal-push %p'
# Force a segment switch at most every 5 minutes when there is activity: RPO <= 5 minutes.
archive_timeout = 300
