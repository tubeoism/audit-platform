name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit_ci
          POSTGRES_PASSWORD: audit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      AUDIT_TEST_PG: Host=localhost;Port=5432;Database=postgres;Username=audit_ci;Password=audit_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore AuditPlatform.slnx
      - run: dotnet build AuditPlatform.slnx --no-restore -c Release
      - run: dotnet test --solution AuditPlatform.slnx --no-build -c Release
      - name: Publish master for linux-arm64
        run: dotnet publish src/AuditPlatform.Master -c Release -r linux-arm64 --self-contained false -o out/master
      - name: Check for pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/AuditPlatform.Master.Data

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish src/AuditPlatform.Client.Wpf -c Release -r win-x64 --self-contained false -o out/client
